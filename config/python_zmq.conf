# 文本客户端连接 Python RAG 服务的配置；检索参数由 Python 服务的启动选项控制。
# 读取方式：edge_voice_rag --config config/python_zmq.conf，由 AppConfig 解析。
# 配置格式为 key=value；注释独占一行，以 # 开头，不要把注释追加在值后面。
# 相对文件路径按程序启动时的工作目录解析，建议从项目/部署根目录启动。

# 本地 BM25 使用的手册分块索引文件；仅 rag_backend=local 时加载；相对路径从程序工作目录解析。
knowledge_path=vector_db/chunks.json
# 本地 BM25 最终返回的最大文档块数，正整数；远程模式不传此值，远程 top-k 由服务端配置。
top_k=3

# 文本客户端的 RAG 后端：local=进程内 BM25，zmq=C++ 远程服务，python_zmq=Python 远程服务。
rag_backend=python_zmq
# 远程 RAG 的 ZeroMQ 地址；C++ 服务通常为 5555，Python 服务通常为 5556；local 模式不使用。
rag_endpoint=tcp://localhost:5556
# 远程 RAG 请求的收发超时，单位毫秒，正整数；仅使用远程 RAG 时生效。
rag_timeout_ms=3000

# 文本客户端调用的 LLM ZeroMQ 普通请求接口；默认端口 8899，需单独启动相应服务。
llm_endpoint=tcp://localhost:8899
# 文本客户端等待 LLM 服务收发的超时，单位毫秒，正整数；模型生成慢时可适当增大。
llm_timeout_ms=30000
