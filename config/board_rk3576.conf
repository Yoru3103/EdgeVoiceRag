knowledge_path=docs/vehicle_manual.txt
top_k=3

# 先在板端执行 arecord -l 和 aplay -l 确认名称
capture_device=plughw:CARD=rockchipes8388,DEV=0
playback_device=plughw:CARD=rockchipes8388,DEV=0

asr_model_path=models/asr/sensevoice/model.int8.onnx
asr_tokens_path=models/asr/sensevoice/tokens.txt

vad_model_path=models/vad/silero_vad.onnx

tts_model_dir=models/tts/vits-melo-tts-zh_en

# PC 联调使用 mock；上板改成 rkllm
llm_backend=rkllm
llm_model_path=models/llm/qwen2.5-1.5b-rk3576.rkllm

asr_num_threads=2
vad_num_threads=1
tts_num_threads=2

llm_max_new_tokens=256
llm_max_context_len=2048

normal_vad_threshold=0.25
barge_vad_threshold=0.60

normal_silence_seconds=0.8
barge_silence_seconds=0.5

# 0 表示持续运行
max_turns=0
