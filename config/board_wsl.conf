# WSL 语音应用配置：Hybrid 检索 + Mock LLM；未列出的设备后端使用 BoardAppConfig 默认值 mock。
# 读取方式：board_voice_assistant 的 BoardAppConfig；不要与文本客户端 AppConfig 混用。
# 配置格式为 key=value；注释独占一行，以 # 开头，不要把注释追加在值后面。
# 相对文件路径按程序启动时的工作目录解析，建议从项目/部署根目录启动。
# 同名键以后出现的值为准；未列出的键使用 BoardAppConfig 默认值。

# 车辆手册分块索引路径；当前使用 chunks.json，供检索器加载；相对路径从程序工作目录解析。
knowledge_path=vector_db/chunks.json
# 每次检索最终返回的最大文档块数，正整数；增加会扩大回答材料，也可能引入无关内容。
top_k=3

# 板端/语音程序的检索方式：bm25=关键词，dense=BGE 向量，hybrid=两路 RRF 融合。
# dense/hybrid 需要编译时开启 EDGE_ENABLE_BGE_EMBEDDER，并准备匹配模型与索引。
retrieval_backend=hybrid

# BGE 查询向量编码器的 ONNX 模型文件；dense/hybrid 使用，需与离线文档向量的模型契约兼容。
bge_model_path=models/embedding/bge-small-zh-v1.5/model.onnx
# BGE 的 tokenizer.json 分词器文件；需与 bge_model_path 对应，dense/hybrid 使用。
bge_tokenizer_path=models/embedding/bge-small-zh-v1.5/tokenizer.json

# Dense 索引元数据 JSON；记录维度、文档块顺序/ID、归一化与指纹等，需与手册及向量文件匹配。
dense_index_metadata_path=vector_db/bge-small-zh-v1.5/index_meta.json
# Dense 文档向量文件；小端 float32 连续存储（embeddings.f32），与元数据按行对应。
dense_embeddings_path=vector_db/bge-small-zh-v1.5/embeddings.f32

# Dense 召回的最低余弦相似度，范围 [-1, 1]；低于本值的结果被丢弃。
# -1 表示使用最低门槛；若开启 relevance_filter_enabled，后续仍会进行相关性过滤。
dense_minimum_similarity=-1.0

# Hybrid 的 RRF 排名平滑常数，必须大于 0；每路贡献为 weight / (本值 + 排名)，排名从 1 开始。
# 数值越大，前后排名的贡献差距越小；它不是最终返回条数 top_k。
hybrid_rrf_k=60.0
# Hybrid 中 BM25 排名的融合权重，非负；越大越偏重关键词路；不能与 dense 权重同时为 0。
hybrid_sparse_weight=1.0
# Hybrid 中 Dense 排名的融合权重，非负；越大越偏重语义路；不能与 sparse 权重同时为 0。
hybrid_dense_weight=1.0
# Hybrid 每路召回的候选数设置，正整数；实际取请求条数与本值的较大者，再融合并截取最终 top_k。
hybrid_candidate_top_k=20

# 是否过滤低相关性检索结果；true/1 开启，false/0 关闭，作用于所选检索后端的外层。
# 开启时，原始 BM25 分数或原始 Dense 相似度任一路达到下面门槛即可保留，不使用 RRF 分数判断。
relevance_filter_enabled=true
# 相关性过滤的最低原始 BM25 分数，有限正数；与 Dense 门槛是“或”关系，仅过滤开启时生效。
relevance_minimum_sparse_score=6.0
# 相关性过滤的最低原始 Dense 余弦相似度，严格介于 0 和 1；与 BM25 门槛是“或”关系。
relevance_minimum_dense_similarity=0.40
# 过滤前向内层检索器请求的候选数设置，正整数；实际取本值与最终 top_k 的较大者，避免过滤后数量不足。
relevance_candidate_top_k=20

# 手册直答的原始 BM25 高置信门槛，有限正数；事实类问题的首条结果达标可不经 LLM 直接回答。
# 与下面 Dense 直答门槛是“或”关系；这不是 relevance 过滤门槛，也不是 RRF 分数。
response_direct_minimum_sparse_score=8.0
# 手册直答的原始 Dense 相似度门槛，严格介于 0 和 1；事实类首条结果满足本值或 BM25 直答门槛即可。
response_direct_minimum_dense_similarity=0.55

# ALSA 录音 PCM 设备名；default 为系统默认，plughw:CARD=...,DEV=... 指定声卡/设备；用 arecord -L/-l 查看。
capture_device=default
# ALSA 播放 PCM 设备名；default 为系统默认，也可指定 plughw 声卡/设备；用 aplay -L/-l 查看。
playback_device=default

# SenseVoice 语音识别 ONNX 模型文件，输入语音、输出文本；需开启 EDGE_ENABLE_SHERPA_ASR。
asr_model_path=models/asr/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/model.int8.onnx
# ASR 的 tokens.txt 词表文件；必须与 asr_model_path 中的识别模型配套。
asr_tokens_path=models/asr/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/tokens.txt

# Silero VAD 的 ONNX 模型文件，用于检测起声和语句结束；需开启 EDGE_ENABLE_SHERPA_VAD。
vad_model_path=models/vad/silero_vad.onnx

# sherpa-onnx TTS 资源目录；当前入口读取其中的 model.int8.onnx、lexicon.txt、tokens.txt、date.fst、number.fst。
tts_model_dir=models/tts/vits-melo-tts-zh_en

# 本地生成后端：mock=固定模拟回答，rkllm=Rockchip 模型推理；rkllm 需编译时开启 EDGE_ENABLE_RKLLM。
# mock 只替换生成后端，不会把 ASR、TTS 或声卡一起替换成 Mock。
llm_backend=mock
# RKLLM 的 .rkllm 模型文件路径；llm_backend=rkllm 时必填，mock 时可留空；需与芯片和 Runtime 匹配。
llm_model_path=

# Agent 规划方式：rule=确定性规则，llm=LLM 工具规划，auto=mock 后端用 rule、其余用 llm。
# llm 不能搭配普通 MockLlmBackend，因为后者不生成工具调用 JSON。
agent_planner=rule
# 单次 Agent 工作流的最大规划步骤数，范围 1～16；工具调用和最终回答都参与步骤计数，用于限制循环。
agent_max_steps=4
# 写操作等待用户确认的有效期，单位毫秒，范围 1000～300000；30000 即 30 秒。
# 后续查询/交互时检查待确认动作是否过期，不是后台定时器准点清理。
agent_confirmation_timeout_ms=30000
# Mock 车内温度，单位摄氏度，范围 [-50, 100]；仅 mock 设备后端使用，iio 时从传感器读取。
agent_mock_temperature_c=28.5
# Mock 相对湿度，单位 %RH，范围 [0, 100]；仅 mock 设备后端使用。
agent_mock_humidity_percent=60.0

# ASR 推理线程数，正整数；当前入口使用 CPU provider，线程过多可能与 TTS 等模块争抢 CPU。
asr_num_threads=2
# VAD 推理线程数，正整数；普通录音和打断检测都使用该设置，当前入口使用 CPU provider。
vad_num_threads=1
# TTS 合成线程数，正整数；当前入口使用 CPU provider，应结合首播延迟和 CPU 竞争测量调整。
tts_num_threads=2

# RKLLM 单次生成的新 token 数上限，单位 token；不是汉字数；用于普通回答和 LLM Planner，mock 不使用。
llm_max_new_tokens=256
# RKLLM 的最大上下文长度设置，单位 token；需容纳提示词/历史及生成内容，并符合模型与 SDK 能力，mock 不使用。
llm_max_context_len=2048

# 普通录音的起声概率阈值，严格介于 0 和 1；越低越敏感，越高越容易忽略轻声/远处语音。
normal_vad_threshold=0.25
# 回答/播放期间的打断起声概率阈值，严格介于 0 和 1；通常设得比普通阈值高，以减少误打断。
barge_vad_threshold=0.60

# 普通录音判断一句话结束所需的连续静音时长，单位秒；增大会等待更久，减小可能截断停顿。
normal_silence_seconds=0.8
# 打断起声后收集新问题时，判定该句话结束所需的连续静音时长，单位秒；不控制首次停播时机。
barge_silence_seconds=0.5

# 连续语音会话的最大处理轮数，非负整数；0 表示不限制，正数到达轮数后结束会话。
max_turns=0
