# 项目私有ALSA配置；启动前设置ALSA_CONFIG_PATH为本文件绝对路径。
# 保留系统PCM定义，不修改/etc/asound.conf或/root/.asoundrc。
</usr/share/alsa/alsa.conf>

# 已验证板卡的ES8388物理PCM；name可按/proc/asound/cards核对。
pcm.edge_voice_hw {
    type hw
    card rockchipes8388
    device 0
}

# 应用录音保持16k，TTS可保留44.1k；plug将两路硬件端统一到16k。
# 解决同一I2S/codec录放音的symmetric_rate约束，保留并发打断采集。
pcm.edge_voice_16k {
    type plug
    # 使用ALSA内置linear转换器，部署无需额外外部重采样插件。
    rate_converter "linear"
    slave {
        pcm "edge_voice_hw"
        rate 16000
    }
}
