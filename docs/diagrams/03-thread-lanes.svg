<text x="32" y="49" font-size="32" text-anchor="start" font-weight="700">03  五类应用线程如何协作</text>
<text x="32" y="82" font-size="17" text-anchor="start" style="fill:#64748b">实线传数据，虚线发控制 / 通知；future 是结果句柄，不是额外线程</text>
<rect x="24" y="150" width="1392" height="108" rx="14" fill="#eef2f7" stroke="none" stroke-width="0"/>
<rect x="24" y="150" width="6" height="108" rx="3" fill="#64748b" stroke="#64748b" stroke-width="0"/>
<text x="48" y="193" font-size="24" text-anchor="start" style="fill:#64748b" font-weight="700">T0  主会话</text>
<text x="48" y="226" font-size="17" text-anchor="start" style="fill:#64748b">录音、识别与调度</text>
<rect x="24" y="280" width="1392" height="108" rx="14" fill="#eaf2ff" stroke="none" stroke-width="0"/>
<rect x="24" y="280" width="6" height="108" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="48" y="323" font-size="24" text-anchor="start" style="fill:#2563eb" font-weight="700">T1  回答任务</text>
<text x="48" y="356" font-size="17" text-anchor="start" style="fill:#64748b">每轮 std::async</text>
<rect x="24" y="410" width="1392" height="108" rx="14" fill="#f2ecff" stroke="none" stroke-width="0"/>
<rect x="24" y="410" width="6" height="108" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/>
<text x="48" y="453" font-size="24" text-anchor="start" style="fill:#7c3aed" font-weight="700">T3  TTS 线程</text>
<text x="48" y="486" font-size="17" text-anchor="start" style="fill:#64748b">启动后常驻</text>
<rect x="24" y="540" width="1392" height="108" rx="14" fill="#eaf7ee" stroke="none" stroke-width="0"/>
<rect x="24" y="540" width="6" height="108" rx="3" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="48" y="583" font-size="24" text-anchor="start" style="fill:#15803d" font-weight="700">T4  播放线程</text>
<text x="48" y="616" font-size="17" text-anchor="start" style="fill:#64748b">启动后常驻</text>
<rect x="24" y="670" width="1392" height="108" rx="14" fill="#fff3e2" stroke="none" stroke-width="0"/>
<rect x="24" y="670" width="6" height="108" rx="3" fill="#c26b09" stroke="#c26b09" stroke-width="0"/>
<text x="48" y="713" font-size="24" text-anchor="start" style="fill:#c26b09" font-weight="700">T2  打断监听</text>
<text x="48" y="746" font-size="17" text-anchor="start" style="fill:#64748b">每轮 std::async</text>
<rect x="310" y="172" width="240" height="64" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="310" y="172" width="5" height="64" rx="2" fill="#64748b" stroke="#64748b" stroke-width="0"/>
<text x="430.0" y="211.0" font-size="21" text-anchor="middle" font-weight="700">正常录音 → ASR</text>
<rect x="610" y="172" width="250" height="64" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="610" y="172" width="5" height="64" rx="2" fill="#64748b" stroke="#64748b" stroke-width="0"/>
<text x="735.0" y="211.0" font-size="21" text-anchor="middle" font-weight="700">启动 T1、T2</text>
<rect x="930" y="172" width="380" height="64" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="930" y="172" width="5" height="64" rx="2" fill="#64748b" stroke="#64748b" stroke-width="0"/>
<text x="1120.0" y="211.0" font-size="21" text-anchor="middle" font-weight="700">轮询 / get / 下一轮</text>
<rect x="310" y="302" width="240" height="64" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="310" y="302" width="5" height="64" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="430.0" y="341.0" font-size="21" text-anchor="middle" font-weight="700">路由 / 检索 / 生成</text>
<rect x="610" y="302" width="250" height="64" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="610" y="302" width="5" height="64" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="735.0" y="341.0" font-size="21" text-anchor="middle" font-weight="700">回调分句 → 句子队列</text>
<rect x="930" y="302" width="380" height="64" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="930" y="302" width="5" height="64" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="1120.0" y="341.0" font-size="21" text-anchor="middle" font-weight="700">等待输出完成，再返回</text>
<rect x="610" y="432" width="250" height="64" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="610" y="432" width="5" height="64" rx="2" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/>
<text x="735.0" y="471.0" font-size="21" text-anchor="middle" font-weight="700">取句子 → TTS 合成</text>
<rect x="930" y="432" width="380" height="64" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="930" y="432" width="5" height="64" rx="2" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/>
<text x="1120.0" y="471.0" font-size="21" text-anchor="middle" font-weight="700">合成 PCM → 音频队列</text>
<rect x="930" y="562" width="380" height="64" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="930" y="562" width="5" height="64" rx="2" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="1120.0" y="601.0" font-size="21" text-anchor="middle" font-weight="700">取音频 → 播放 / 处理 End</text>
<rect x="310" y="692" width="240" height="64" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="310" y="692" width="5" height="64" rx="2" fill="#c26b09" stroke="#c26b09" stroke-width="0"/>
<text x="430.0" y="731.0" font-size="21" text-anchor="middle" font-weight="700">高阈值 VAD 监听</text>
<rect x="610" y="692" width="250" height="64" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="610" y="692" width="5" height="64" rx="2" fill="#c26b09" stroke="#c26b09" stroke-width="0"/>
<text x="735.0" y="731.0" font-size="21" text-anchor="middle" font-weight="700">起声 → stopPlayback</text>
<rect x="930" y="692" width="380" height="64" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="930" y="692" width="5" height="64" rx="2" fill="#c26b09" stroke="#c26b09" stroke-width="0"/>
<text x="1120.0" y="731.0" font-size="21" text-anchor="middle" font-weight="700">继续录完新问题 → 返回</text>
