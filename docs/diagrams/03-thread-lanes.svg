<polyline points="550,724 610,724" fill="none" stroke="#c26b09" stroke-width="2" marker-end="url(#arrow-amber)"/>
<polyline points="860,724 930,724" fill="none" stroke="#c26b09" stroke-width="2" marker-end="url(#arrow-amber)"/>
<polyline points="860,464 930,464" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<polyline points="735,236 735,267 430,267 430,302" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="543.0" y="256" width="74" height="24" rx="4" fill="#f8fafc" stroke="none" stroke-width="0"/>
<text x="580" y="273" font-size="16" text-anchor="middle" style="fill:#2563eb">启动回答</text>
<polyline points="735,366 735,432" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="718.0" y="385" width="314" height="24" rx="4" fill="#f8fafc" stroke="none" stroke-width="0"/>
<text x="875" y="402" font-size="16" text-anchor="middle" style="fill:#2563eb">SentenceTask · 容量 4</text>
<polyline points="1120,496 1120,562" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<rect x="1102.0" y="516" width="266" height="24" rx="4" fill="#f8fafc" stroke="none" stroke-width="0"/>
<text x="1235" y="533" font-size="16" text-anchor="middle" style="fill:#7c3aed">AudioTask · 容量 2</text>
<polyline points="1310,594 1365,594 1365,334 1310,334" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-green)"/>
<text x="1387" y="532" font-size="16" text-anchor="start" style="fill:#15803d" transform="rotate(-90 1387 532)">End / completed_cv</text>
<polyline points="610,724 580,724 580,350 550,350" fill="none" stroke="#c26b09" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>
<text x="568" y="641" font-size="16" text-anchor="start" style="fill:#c26b09" transform="rotate(-90 568 641)">failed / cancel 当前请求</text>
<polyline points="735,692 735,594 930,594" fill="none" stroke="#c26b09" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>
<rect x="746.0" y="568" width="138" height="24" rx="4" fill="#f8fafc" stroke="none" stroke-width="0"/>
<text x="815" y="585" font-size="16" text-anchor="middle" style="fill:#c26b09">清队列 / 停播</text>
<rect x="24" y="810" width="1392" height="74" rx="10" fill="#edf3fb" stroke="none" stroke-width="0"/>
<text x="40" y="838" font-size="17" text-anchor="start" style="fill:#2563eb">共享 RequestState：shared_ptr 保持存活，mutex 保护字段，completed_cv 通知结束。</text>
<text x="40" y="864" font-size="17" text-anchor="start" style="fill:#2563eb">回调不另设分发线程；RKLLM 回调的实际 OS 线程由 SDK 决定，需用线程 ID 核验。</text>
</svg>