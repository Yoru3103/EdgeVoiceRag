<polyline points="952,416 952,458" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
<polyline points="952,544 952,586" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
