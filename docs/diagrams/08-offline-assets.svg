<text x="32" y="49" font-size="32" text-anchor="start" font-weight="700">08  离线资产：先生成，再由运行时加载</text>
<text x="32" y="82" font-size="17" text-anchor="start" style="fill:#64748b">检索资产和 Planner 训练是两条独立准备链；都不是每轮语音中临时执行</text>
<rect x="32" y="130" width="592" height="756" rx="16" fill="#eef4ff" stroke="#dce4ed" stroke-width="1"/>
