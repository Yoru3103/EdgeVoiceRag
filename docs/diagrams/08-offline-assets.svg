<text x="952.0" y="521.5" font-size="16" text-anchor="middle" style="fill:#64748b">train_qlora.py + 基础模型</text>
<rect x="688" y="586" width="528" height="86" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="688" y="586" width="5" height="86" rx="2" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="952.0" y="622.5" font-size="21" text-anchor="middle" font-weight="700">保存 adapter 与训练指标</text>
