<text x="676" y="162" font-size="22" text-anchor="start" style="fill:#15803d" font-weight="700">Planner 训练与评测</text>
<rect x="56" y="212" width="248" height="80" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
