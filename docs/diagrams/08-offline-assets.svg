<rect x="688" y="330" width="528" height="86" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="688" y="330" width="5" height="86" rx="2" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="952.0" y="366.5" font-size="21" text-anchor="middle" font-weight="700">校验数据与动作格式</text>
