<rect x="56" y="352" width="5" height="86" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="180.0" y="388.5" font-size="21" text-anchor="middle" font-weight="700">分块 → chunks.json</text>
<text x="180.0" y="415.5" font-size="16" text-anchor="middle" style="fill:#64748b">build_index.py</text>
