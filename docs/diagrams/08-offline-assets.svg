<text x="328.0" y="550.5" font-size="21" text-anchor="middle" font-weight="700">离线计算文档向量</text>
<text x="328.0" y="577.5" font-size="16" text-anchor="middle" style="fill:#64748b">embeddings.f32 + index_meta.json</text>
