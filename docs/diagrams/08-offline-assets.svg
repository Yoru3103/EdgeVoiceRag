<text x="328.0" y="696.5" font-size="21" text-anchor="middle" font-weight="700">校验模型、索引与指纹</text>
<text x="328.0" y="723.5" font-size="16" text-anchor="middle" style="fill:#64748b">verify_dense_index.py</text>
<polyline points="328,600 328,660" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
