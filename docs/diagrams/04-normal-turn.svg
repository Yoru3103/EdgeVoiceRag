<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1130" viewBox="0 0 1280 1130" role="img" aria-labelledby="title desc">
<title id="title">04  正常一轮：生成结束后为什么还要等</title><desc id="desc">代表性时序；不同句子的生成、合成与播放可以重叠</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#2563eb"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7c3aed"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#15803d"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#c26b09"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#64748b"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#c24138"/></marker>
</defs>
<rect width="1280" height="1130" rx="20" fill="#f8fafc"/>
<style>text{font-family:Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Segoe UI, Arial, sans-serif;fill:#16324f}.small{font-size:16px}.muted{fill:#64748b}</style>
<text x="32" y="49" font-size="32" text-anchor="start" font-weight="700">04  正常一轮：生成结束后为什么还要等</text>
<text x="32" y="82" font-size="17" text-anchor="start" style="fill:#64748b">代表性时序；不同句子的生成、合成与播放可以重叠</text>
<rect x="45" y="120" width="190" height="76" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="45" y="120" width="5" height="76" rx="2" fill="#64748b" stroke="#64748b" stroke-width="0"/>
<text x="140.0" y="151.5" font-size="21" text-anchor="middle" font-weight="700">T0 主会话</text>
<text x="140.0" y="178.5" font-size="16" text-anchor="middle" style="fill:#64748b">录音 / 调度</text>
<line x1="140" y1="204" x2="140" y2="1060" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="295" y="120" width="190" height="76" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="295" y="120" width="5" height="76" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="390.0" y="151.5" font-size="21" text-anchor="middle" font-weight="700">T1 回答</text>
<text x="390.0" y="178.5" font-size="16" text-anchor="middle" style="fill:#64748b">路由 / 生成</text>
<line x1="390" y1="204" x2="390" y2="1060" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="545" y="120" width="190" height="76" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="545" y="120" width="5" height="76" rx="2" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/>
<text x="640.0" y="151.5" font-size="21" text-anchor="middle" font-weight="700">T3 TTS</text>
<text x="640.0" y="178.5" font-size="16" text-anchor="middle" style="fill:#64748b">句子 → PCM</text>
<line x1="640" y1="204" x2="640" y2="1060" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="795" y="120" width="190" height="76" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="795" y="120" width="5" height="76" rx="2" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="890.0" y="151.5" font-size="21" text-anchor="middle" font-weight="700">T4 播放</text>
<text x="890.0" y="178.5" font-size="16" text-anchor="middle" style="fill:#64748b">PCM → 声卡</text>
<line x1="890" y1="204" x2="890" y2="1060" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="1045" y="120" width="190" height="76" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="1045" y="120" width="5" height="76" rx="2" fill="#c26b09" stroke="#c26b09" stroke-width="0"/>
<text x="1140.0" y="151.5" font-size="21" text-anchor="middle" font-weight="700">T2 监听</text>
<text x="1140.0" y="178.5" font-size="16" text-anchor="middle" style="fill:#64748b">等待起声</text>
<line x1="1140" y1="204" x2="1140" y2="1060" stroke="#cbd5e1" stroke-width="1.5"/>
<polyline points="140,240 178,240 178,262 140,262" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-muted)"/>
<text x="192" y="254" font-size="18" text-anchor="start">录音与 ASR</text>
<rect x="24" y="225" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="246" font-size="15" text-anchor="middle" font-weight="700">1</text>
<polyline points="140,320 390,320" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="265.0" y="308" font-size="18" text-anchor="middle">启动回答任务</text>
<rect x="24" y="305" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="326" font-size="15" text-anchor="middle" font-weight="700">2</text>
<polyline points="140,385 1140,385" fill="none" stroke="#c26b09" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="640.0" y="373" font-size="18" text-anchor="middle">同时启动打断监听</text>
<rect x="24" y="370" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="391" font-size="15" text-anchor="middle" font-weight="700">3</text>
<polyline points="390,470 640,470" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="515.0" y="458" font-size="18" text-anchor="middle">完整句子入队（SentenceTask）</text>
<rect x="24" y="455" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="476" font-size="15" text-anchor="middle" font-weight="700">4</text>
<polyline points="640,545 890,545" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="765.0" y="533" font-size="18" text-anchor="middle">合成 PCM 入队（AudioTask）</text>
<rect x="24" y="530" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="551" font-size="15" text-anchor="middle" font-weight="700">5</text>
<polyline points="890,620 928,620 928,642 890,642" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="942" y="634" font-size="18" text-anchor="start">播放本句</text>
<rect x="24" y="605" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="626" font-size="15" text-anchor="middle" font-weight="700">6</text>
<polyline points="390,710 640,710" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="515.0" y="698" font-size="18" text-anchor="middle">生成结束：投递 End</text>
<rect x="24" y="695" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="716" font-size="15" text-anchor="middle" font-weight="700">7</text>
<polyline points="640,780 890,780" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="765.0" y="768" font-size="18" text-anchor="middle">转发 End 到音频队列</text>
<rect x="24" y="765" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="786" font-size="15" text-anchor="middle" font-weight="700">8</text>
<polyline points="890,850 390,850" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-green)"/>
<text x="640.0" y="838" font-size="18" text-anchor="middle">完成通知：completed_cv</text>
<rect x="24" y="835" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="856" font-size="15" text-anchor="middle" font-weight="700">9</text>
<polyline points="390,925 140,925" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
<text x="265.0" y="913" font-size="18" text-anchor="middle">返回本轮结果</text>
<rect x="24" y="910" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="931" font-size="15" text-anchor="middle" font-weight="700">10</text>
<polyline points="140,995 1140,995" fill="none" stroke="#c26b09" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="640.0" y="983" font-size="18" text-anchor="middle">取消监听并回收 future</text>
<rect x="24" y="980" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="1001" font-size="15" text-anchor="middle" font-weight="700">11</text>
<text x="32" y="1106" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" font-size="17" fill="#64748b">关键：End 随队列传到播放线程，播放线程通知后，回答任务才结束本轮。</text>
</svg>