<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-labelledby="title desc">
<title id="title">05  起声打断：先停输出，再取消后端</title><desc id="desc">输出控制是方法调用，不是新线程；取消不保证旧请求立即退出</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#2563eb"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7c3aed"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#15803d"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#c26b09"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#64748b"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#c24138"/></marker>
</defs>
<rect width="1280" height="1160" rx="20" fill="#f8fafc"/>
<style>text{font-family:Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Segoe UI, Arial, sans-serif;fill:#16324f}.small{font-size:16px}.muted{fill:#64748b}</style>
<text x="32" y="49" font-size="32" text-anchor="start" font-weight="700">05  起声打断：先停输出，再取消后端</text>
<text x="32" y="82" font-size="17" text-anchor="start" style="fill:#64748b">输出控制是方法调用，不是新线程；取消不保证旧请求立即退出</text>
<rect x="45" y="120" width="190" height="76" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="45" y="120" width="5" height="76" rx="2" fill="#64748b" stroke="#64748b" stroke-width="0"/>
<text x="140.0" y="151.5" font-size="21" text-anchor="middle" font-weight="700">T0 主会话</text>
<text x="140.0" y="178.5" font-size="16" text-anchor="middle" style="fill:#64748b">接收新录音</text>
<line x1="140" y1="204" x2="140" y2="1090" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="295" y="120" width="190" height="76" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="295" y="120" width="5" height="76" rx="2" fill="#c26b09" stroke="#c26b09" stroke-width="0"/>
<text x="390.0" y="151.5" font-size="21" text-anchor="middle" font-weight="700">T2 起声监听</text>
<text x="390.0" y="178.5" font-size="16" text-anchor="middle" style="fill:#64748b">VAD 回调</text>
<line x1="390" y1="204" x2="390" y2="1090" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="545" y="120" width="190" height="76" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="545" y="120" width="5" height="76" rx="2" fill="#c26b09" stroke="#c26b09" stroke-width="0"/>
<text x="640.0" y="151.5" font-size="21" text-anchor="middle" font-weight="700">输出控制方法</text>
<text x="640.0" y="178.5" font-size="16" text-anchor="middle" style="fill:#64748b">由 T2 直接调用</text>
<line x1="640" y1="204" x2="640" y2="1090" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="795" y="120" width="190" height="76" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="795" y="120" width="5" height="76" rx="2" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/>
<text x="890.0" y="151.5" font-size="21" text-anchor="middle" font-weight="700">取消后端</text>
<text x="890.0" y="178.5" font-size="16" text-anchor="middle" style="fill:#64748b">按活动请求转发</text>
<line x1="890" y1="204" x2="890" y2="1090" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="1045" y="120" width="190" height="76" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="1045" y="120" width="5" height="76" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="1140.0" y="151.5" font-size="21" text-anchor="middle" font-weight="700">T1 旧回答</text>
<text x="1140.0" y="178.5" font-size="16" text-anchor="middle" style="fill:#64748b">等待返回 / 清理</text>
<line x1="1140" y1="204" x2="1140" y2="1090" stroke="#cbd5e1" stroke-width="1.5"/>
<polyline points="390,240 428,240 428,262 390,262" fill="none" stroke="#c26b09" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="442" y="254" font-size="18" text-anchor="start">检测到用户起声</text>
<rect x="24" y="225" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="246" font-size="15" text-anchor="middle" font-weight="700">1</text>
<polyline points="390,315 640,315" fill="none" stroke="#c26b09" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="515.0" y="303" font-size="18" text-anchor="middle">stopPlayback</text>
<rect x="24" y="300" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="321" font-size="15" text-anchor="middle" font-weight="700">2</text>
<polyline points="640,390 1140,390" fill="none" stroke="#c26b09" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="890.0" y="378" font-size="18" text-anchor="middle">标记 failed，通知 completed</text>
<rect x="24" y="375" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="396" font-size="15" text-anchor="middle" font-weight="700">3</text>
<polyline points="640,465 678,465 678,487 640,487" fill="none" stroke="#c26b09" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="692" y="479" font-size="18" text-anchor="start">清队列 → 停止播放</text>
<rect x="24" y="450" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="471" font-size="15" text-anchor="middle" font-weight="700">4</text>
<polyline points="640,545 890,545" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="765.0" y="533" font-size="18" text-anchor="middle">cancel(request_id)</text>
<rect x="24" y="530" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="551" font-size="15" text-anchor="middle" font-weight="700">5</text>
<polyline points="890,620 928,620 928,642 890,642" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="942" y="634" font-size="18" text-anchor="start">清 Pending / 尝试 abort</text>
<rect x="24" y="605" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="626" font-size="15" text-anchor="middle" font-weight="700">6</text>
<polyline points="890,700 640,700" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/>
<text x="765.0" y="688" font-size="18" text-anchor="middle">返回取消结果</text>
<rect x="24" y="685" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="706" font-size="15" text-anchor="middle" font-weight="700">7</text>
<polyline points="640,775 390,775" fill="none" stroke="#c26b09" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>
<text x="515.0" y="763" font-size="18" text-anchor="middle">回调返回，继续录完整语句</text>
<rect x="24" y="760" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="781" font-size="15" text-anchor="middle" font-weight="700">8</text>
<polyline points="390,850 140,850" fill="none" stroke="#c26b09" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>
<text x="265.0" y="838" font-size="18" text-anchor="middle">新录音就绪，T0 处理 barge 分支</text>
<rect x="24" y="835" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="856" font-size="15" text-anchor="middle" font-weight="700">9</text>
<polyline points="140,925 1140,925" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="640.0" y="913" font-size="18" text-anchor="middle">get：等待旧回答任务退出</text>
<rect x="24" y="910" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="931" font-size="15" text-anchor="middle" font-weight="700">10</text>
<polyline points="140,1000 178,1000 178,1022 140,1022" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-muted)"/>
<text x="192" y="1014" font-size="18" text-anchor="start">保存录音 → 下一轮 ASR</text>
<rect x="24" y="985" width="30" height="30" rx="15" fill="#e5edf7" stroke="none" stroke-width="0"/>
<text x="39" y="1006" font-size="15" text-anchor="middle" font-weight="700">11</text>
<text x="32" y="1125" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" font-size="17" fill="#64748b">任一分支取得成功录音均保留；已观察到起声时，等待新语句录完。</text>
</svg>