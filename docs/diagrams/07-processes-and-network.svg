<text x="436" y="586" font-size="18" text-anchor="start" style="fill:#7c3aed">RAG：检索 → 生成 / 转发</text>
<text x="896" y="586" font-size="18" text-anchor="start" style="fill:#2563eb">两个数据端口共享一个模型</text>
<rect x="32" y="846" width="1216" height="74" rx="10" fill="#edf3fb" stroke="none" stroke-width="0"/>
<text x="48" y="874" font-size="17" text-anchor="start" style="fill:#2563eb">旧 C++ RAG 使用 5555；文本 CLI 也可直接请求 8899，另有 Python 普通 LLM 替代服务。</text>
<text x="48" y="900" font-size="17" text-anchor="start" style="fill:#2563eb">8901 只匹配活动流请求；双端口不代表模型并发，控制服务也不能保证取消普通非流式生成。</text>
