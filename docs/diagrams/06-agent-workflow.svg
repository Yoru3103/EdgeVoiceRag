<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
<title id="title">06  Agent：一次写操作如何跨轮确认</title><desc id="desc">Planner / Executor / Tool 是调用层次，不是三条独立线程</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#2563eb"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7c3aed"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#15803d"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#c26b09"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#64748b"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#c24138"/></marker>
</defs>
<rect width="1280" height="980" rx="20" fill="#f8fafc"/>
<style>text{font-family:Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Segoe UI, Arial, sans-serif;fill:#16324f}.small{font-size:16px}.muted{fill:#64748b}</style>
<text x="32" y="49" font-size="32" text-anchor="start" font-weight="700">06  Agent：一次写操作如何跨轮确认</text>
<text x="32" y="82" font-size="17" text-anchor="start" style="fill:#64748b">Planner / Executor / Tool 是调用层次，不是三条独立线程</text>
<rect x="32" y="130" width="568" height="646" rx="16" fill="#eef4ff" stroke="#dce4ed" stroke-width="1"/>
<text x="52" y="162" font-size="22" text-anchor="start" style="fill:#2563eb" font-weight="700">本轮：提出操作，等待确认</text>
<rect x="680" y="130" width="568" height="646" rx="16" fill="#eef7f0" stroke="#dce4ed" stroke-width="1"/>
<text x="700" y="162" font-size="22" text-anchor="start" style="fill:#15803d" font-weight="700">下一轮：处理确认，继续工作流</text>
<rect x="64" y="214" width="504" height="92" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="64" y="214" width="5" height="92" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="316.0" y="253.5" font-size="21" text-anchor="middle" font-weight="700">用户提出设备任务</text>
<text x="316.0" y="280.5" font-size="16" text-anchor="middle" style="fill:#64748b">例如：温度超过阈值就打开空调</text>
<rect x="64" y="350" width="504" height="92" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="64" y="350" width="5" height="92" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="316.0" y="389.5" font-size="21" text-anchor="middle" font-weight="700">Planner 决定下一步</text>
<text x="316.0" y="416.5" font-size="16" text-anchor="middle" style="fill:#64748b">Rule 或 LLM，输出结构化动作</text>
<rect x="64" y="486" width="504" height="92" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="64" y="486" width="5" height="92" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="316.0" y="525.5" font-size="21" text-anchor="middle" font-weight="700">Executor 检查工具</text>
<text x="316.0" y="552.5" font-size="16" text-anchor="middle" style="fill:#64748b">白名单 / 参数 / 是否需要确认</text>
<rect x="64" y="622" width="504" height="92" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="64" y="622" width="5" height="92" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="316.0" y="661.5" font-size="21" text-anchor="middle" font-weight="700">保存 Pending，播报确认提示</text>
<text x="316.0" y="688.5" font-size="16" text-anchor="middle" style="fill:#64748b">此时还没有执行写操作</text>
<rect x="712" y="214" width="504" height="92" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="712" y="214" width="5" height="92" rx="2" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="964.0" y="253.5" font-size="21" text-anchor="middle" font-weight="700">用户说“确认 / 取消”</text>
<text x="964.0" y="280.5" font-size="16" text-anchor="middle" style="fill:#64748b">新 request_id，同一 session_id</text>
<rect x="712" y="350" width="504" height="92" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="712" y="350" width="5" height="92" rx="2" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="964.0" y="389.5" font-size="21" text-anchor="middle" font-weight="700">检查 Pending 与确认有效期</text>
<text x="964.0" y="416.5" font-size="16" text-anchor="middle" style="fill:#64748b">超时或取消：清理，不执行写工具</text>
<rect x="712" y="486" width="504" height="92" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="712" y="486" width="5" height="92" rx="2" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="964.0" y="525.5" font-size="21" text-anchor="middle" font-weight="700">确认后执行保存的工具</text>
<text x="964.0" y="552.5" font-size="16" text-anchor="middle" style="fill:#64748b">条件工具此时重新读取环境并判断</text>
<rect x="712" y="622" width="504" height="92" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<rect x="712" y="622" width="5" height="92" rx="2" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="964.0" y="661.5" font-size="21" text-anchor="middle" font-weight="700">Observation → Planner</text>
<text x="964.0" y="688.5" font-size="16" text-anchor="middle" style="fill:#64748b">继续规划或生成最终业务答复</text>
<polyline points="316,306 316,350" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<polyline points="964,306 964,350" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
<polyline points="316,442 316,486" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<polyline points="964,442 964,486" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
<polyline points="316,578 316,622" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<polyline points="964,578 964,622" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="980" y="470" font-size="16" text-anchor="start" style="fill:#15803d">仅有效确认</text>
<polyline points="568,668 640,668 640,260 712,260" fill="none" stroke="#c26b09" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>
<text x="628" y="543" font-size="17" text-anchor="start" style="fill:#c26b09" transform="rotate(-90 628 543)">跨语音轮次</text>
<rect x="32" y="814" width="1216" height="74" rx="10" fill="#fff3e2" stroke="none" stroke-width="0"/>
<text x="48" y="842" font-size="17" text-anchor="start" style="fill:#c26b09">只读工具可直接执行；遇到最终答复可提前结束；循环仍受 maximum_steps 限制。</text>
<text x="48" y="868" font-size="17" text-anchor="start" style="fill:#c26b09">Linux IIO 读取真实温湿度；空调 / LED 当前仍为内存状态，取消不会回滚已执行动作。</text>
</svg>